backend:
  replicaCount: 1
  image:
    repository: shekhawataditya/jerney-backend
    tag: v1.0.0
    pullPolicy: IfNotPresent    
  service:
    type: ClusterIP
    port: 5000
  env:
    - name: DB_HOST
      value: jerney-db          
    - name: DB_PORT
      value: "5432"
    - name: DB_NAME
      value: jerney_db
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: jerney-secret
          key: DB_USER
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: jerney-secret
          key: DB_PASSWORD
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "500m" 


frontend:
  replicaCount: 1
  image:
    repository: shekhawataditya/jerney-frontend
    tag: v1.0.0
    pullPolicy: IfNotPresent  
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "500m" 

db:
  replicaCount: 1
  image: 
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5432
  env:
    - name: POSTGRES_USER
      valueFrom:
        secretKeyRef:
          name: jerney-secret
          key: DB_USER
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: jerney-secret
          key: DB_PASSWORD
    - name: POSTGRES_DB
      valueFrom:
        secretKeyRef:
          name: jerney-secret
          key: DB_NAME                 
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "500m"


      

  
  
