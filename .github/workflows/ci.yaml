name: Jerney-CI-Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/jerney-${{ matrix.service }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0 
        with:
            image-ref: ${{ secrets.DOCKER_USERNAME}}/jerney-${{matrix.service}}:${{github.sha}}   
            severity: 'CRITICAL,HIGH'
            exit-code: '1'

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME}}/jerney-${{matrix.service}}:${{github.sha}}
            
