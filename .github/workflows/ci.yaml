name: Jerney-CI-Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code 
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{secrets.DOCKER_USERNAME}}
                password: ${{secrets.DOCKER_TOKEN}}
                
            - name: Build and push backend image
              uses: docker/build-push-action@v5
              with:
                context: ./backend
                push: true
                tags: ${{secrets.DOCKER_USERNAME}}/jerney-backens:${{github.sha}} 
                
            - name: Build and push frontend image
              uses: docker/build-push-action@v5
              with:
                context: ./frontend
                push: true
                tags: ${{secrets.DOCKER_USERNAME}}/jerney-frontend:${{github.sha}}   
