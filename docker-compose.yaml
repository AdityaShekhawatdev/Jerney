services:
  jerney-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jerney-backend
    environment:
      DB_HOST: jerney-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    expose:
      - "5000"
    depends_on:
      jerney-db:
        condition: service_healthy

  jerney-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jerney-frontend
    ports:
      - "80:8080"
    depends_on:
     - jerney-backend    

  jerney-db:
    image: postgres:16-alpine
    container_name: jerney-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data 

volumes:
  db_data:         
            
    